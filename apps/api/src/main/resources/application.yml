spring:
  application:
    name: universal-doc-generator-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

docgen:
  storage-path: ./storage
  max-project-size: 1000000000
  llm:
    enabled: false
    provider: mock  # mock, openai, anthropic, gemini, bedrock
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    aws-region: ${AWS_REGION:us-east-1}

logging:
  level:
    root: INFO
    io.docgen: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
